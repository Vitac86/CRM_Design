<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Document Template Builder · QA</title>
  <link rel="icon" href="../assets/icons/favicon_blue.ico"/>
  <style>
    body { margin: 20px; color: #1e293b; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 20px; }
    #summary { margin: 10px 0; padding: 10px; border-radius: 5px; background: #eef2f7; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d7dee8; padding: 5px 7px; text-align: left; }
    .pass { color: #087443; } .fail { color: #b42318; }
    iframe { position: fixed; left: -20000px; width: 1440px; height: 900px; border: 0; }
    #qa-output { display: none; }
  </style>
</head>
<body>
  <h1>Document Template Builder · automated browser QA</h1>
  <p>Runs against the actual builder, local PDF.js worker, production renderer and all committed maps.</p>
  <div id="summary">Starting…</div>
  <table><thead><tr><th>#</th><th>Test</th><th>Result</th><th>Details</th></tr></thead><tbody id="results"></tbody></table>
  <pre id="qa-output"></pre>
  <iframe id="builder" src="document-template-builder.html?embeddedQa=1" title="Builder under test"></iframe>
  <script>
  (function () {
    'use strict';
    var tests = [];
    var results = [];
    var frame;
    var app;
    var ns;

    function add(name, fn) { tests.push({ name: name, fn: fn }); }
    function assert(value, message) { if (!value) throw new Error(message || 'Assertion failed'); }
    function equal(a, b, message) { if (a !== b) throw new Error((message || 'Values differ') + ': ' + a + ' !== ' + b); }
    function pdfFile(bytes, name) { return new frame.File([bytes], name || 'replacement.pdf', { type: 'application/pdf' }); }
    function makePdf(sizes) {
      return frame.PDFLib.PDFDocument.create().then(function (doc) {
        sizes.forEach(function (size) { doc.addPage(frame.Array.of(Number(size.width), Number(size.height))); });
        return doc.save();
      });
    }
    function currentField() { return app.state.field(); }

    add('Builder opens through HTTP', function () { assert(/^https?:$/.test(frame.location.protocol)); assert(app.ready); });
    add('file:// blocker has the required message', function () { equal(ns.constants.protocolMessage, 'Конструктор должен быть открыт через локальный HTTP-сервер.'); });
    add('Existing template catalog loads', function () { assert(app.catalogAudit && !app.catalogAudit.pdfFailures.length); });
    add('All 18 maps are discoverable and open', function () {
      equal(app.catalog.length, 18); equal(Object.keys(frame.CRMDocumentEngine.fieldMaps).length, 18);
      var opened = [];
      var chain = Promise.resolve();
      app.catalog.forEach(function (entry) {
        chain = chain.then(function () { return app.openExisting(entry.overlayTemplateId); })
          .then(function () {
            assert(!app.state.validation.warnings.some(function (warning) { return warning.code === 'unused-wizard'; }), 'False unused wizard source: ' + entry.overlayTemplateId);
            opened.push(entry.overlayTemplateId);
          });
      });
      return chain.then(function () { equal(opened.length, 18); });
    });
    add('A multi-page PDF renders', function () { return app.openExisting('accession-application-fl').then(function () { equal(app.viewer.pages.length, 3); assert(app.viewer.canvas.width > 0); }); });
    add('A mixed-page-size PDF renders correctly', function () {
      return makePdf([{width: 595, height: 842}, {width: 842, height: 595}]).then(function (bytes) { return app.viewer.load(bytes, 'mixed-size.pdf'); })
        .then(function (info) { equal(info.pageCount, 2); assert(info.pages[0].width !== info.pages[1].width); return app.openExisting('accession-application-fl'); });
    });
    add('Selecting a field opens its properties', function () { var id = app.state.project.fields[0].id; app.state.selectField(id); equal(currentField().id, id); assert(frame.document.querySelector('#dtb-inspector h2')); });
    add('Moving a field changes PDF-point coordinates', function () { var field = currentField(); var before = field.left; app.state.updateField(field.id, { left: before + 1 }, 'qa move'); equal(currentField().left, before + 1); });
    add('Undo restores old coordinates', function () { var after = currentField().left; app.state.undo(); equal(currentField().left, after - 1); });
    add('Redo reapplies the move', function () { var before = currentField().left; app.state.redo(); equal(currentField().left, before + 1); });
    add('Keyboard nudge works at 0.25 pt', function () { var before = currentField().left; frame.document.body.dispatchEvent(new frame.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })); equal(currentField().left, before + 0.25); });
    add('Field resize works from keyboard', function () { var before = currentField().width; frame.document.body.dispatchEvent(new frame.KeyboardEvent('keydown', { key: 'ArrowRight', altKey: true, bubbles: true })); equal(currentField().width, before + 0.25); });
    add('Text baseline editing works', function () { var field = currentField(); var before = field.baselineTop; app.state.updateField(field.id, { baselineTop: before + 0.25 }, 'qa baseline'); equal(currentField().baselineTop, before + 0.25); });
    add('Checkbox editing works', function () { var check = app.state.project.fields.find(function (field) { return field.type === 'check'; }); assert(check); app.state.selectField(check.id); app.state.updateField(check.id, { markStyle: 'cross', boxSize: 7.5 }, 'qa checkbox'); equal(currentField().markStyle, 'cross'); });
    add('Source selection works', function () { var field = app.state.project.fields.find(function (item) { return (item.type || 'text') !== 'check'; }); app.state.selectField(field.id); app.state.updateField(field.id, { source: 'subject.displayName' }, 'qa source'); equal(currentField().source, 'subject.displayName'); });
    add('showWhen editing works', function () { app.state.updateField(currentField().id, { showWhen: { source: 'subject.kind', equals: 'individual' } }, 'qa condition'); equal(currentField().showWhen.equals, 'individual'); });
    add('Russian test data renders', function () { app.state.profileId = 'ru-resident-normal'; app.state.payloadOverrides = {}; return app.openExisting('accession-application-fl').then(function () { app.state.profileId = 'ru-resident-normal'; return app.generatePreview(); }).then(function (result) { assert(result.blob.size > 1000); }); });
    add('English test data renders', function () { app.state.profileId = 'en-nonresident-normal'; app.state.payloadOverrides = {}; return app.generatePreview().then(function (result) { assert(result.blob.size > 1000); }); });
    add('Long values use production fit logic', function () { return ns.validation.analyzeProfile(app.state.project, 'ru-resident-long', {}).then(function (fit) { assert(fit.fields.length === app.state.project.fields.length); assert(frame.CRMDocumentEngine.textLayout.fitText); }); });
    add('Unsupported glyph produces a clear error', function () {
      var field = app.state.project.fields.find(function (item) { return (item.type || 'text') !== 'check' && item.source; });
      var overrides = {}; overrides[field.source] = '测试';
      return ns.validation.analyzeProfile(app.state.project, 'ru-resident-normal', overrides).then(function (fit) {
        var result = fit.fields.find(function (entry) { return entry.fieldId === field.id; }).result;
        equal(result.status, 'unsupported-glyph'); assert(/^U\+/.test(result.unsupported[0].unicode));
      });
    });
    add('Real PDF preview generates', function () { app.state.profileId = 'ru-resident-normal'; app.state.payloadOverrides = {}; return app.generatePreview().then(function (result) { assert(result.blob instanceof frame.Blob); }); });
    add('Preview has the correct page count', function () { equal(app.previewInspection.pageCount, app.state.project.expectedPages); assert(app.previewInspection.noAppendedPages); });
    add('Preview has zero AcroForm fields', function () { equal(app.previewInspection.acroFormFields, 0); });
    add('Preview has zero widgets', function () { equal(app.previewInspection.widgets, 0); });
    add('Stale Blob URLs are revoked', function () { var old = app.previewUrl; return app.generatePreview().then(function () { assert(app.revokedUrls.indexOf(old) !== -1); }); });
    add('Builder JSON export/import round-trips', function () { var text = ns.io.exportProject(app.state.project); var imported = ns.io.importProjectText(text).project; assert(ns.io.semanticEqual(app.state.project, imported)); });
    add('Production JS export is deterministic', function () { var a = ns.io.productionJs(app.state.project); var b = ns.io.productionJs(app.state.project); equal(a, b); assert(!/function\s*\(/.test(a.replace(/\(function \(global\)/, ''))); });
    add('Existing-map semantic round-trip succeeds for 18 maps', function () {
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        var project = ns.schema.fromProduction(map, entry);
        var exported = ns.schema.toProduction(project);
        assert(ns.io.semanticEqual(map, exported), 'Round-trip failed: ' + map.id);
      });
    });
    // ── Readability policy and continuation lines ─────────────────────────
    add('New text fields default to 12 pt preferred and 9 pt minimum', function () {
      return app.openExisting('accession-application-fl').then(function () {
        var before = app.state.project.fields.length;
        app.editor._up({
          pointerId: 1,
          preventDefault: function () {}
        });
        // Draw a region tall enough for two 12 pt lines.
        app.editor.interaction = {
          kind: 'draw', tool: 'text',
          start: { left: 60, top: 300 }, current: { left: 260, top: 340 }
        };
        app.editor._up({ pointerId: 1 });
        var field = app.state.project.fields[app.state.project.fields.length - 1];
        equal(app.state.project.fields.length, before + 1, 'field added');
        equal(field.fontSize, 12, 'preferred size');
        equal(field.minFontSize, 9, 'minimum size');
        assert(field.lineHeight >= 12, 'line height suits 12 pt text: ' + field.lineHeight);
        assert(field.multiline, 'a two-line region wraps by default');
        app.state.deleteSelected();
      });
    });
    add('A minimum below 9 pt is rejected with the required message', function () {
      var project = cloneProject(app.state.project);
      project.fields.push({
        id: 'qa-below-floor', type: 'text', source: 'field.clientFullName',
        page: 0, left: 60, top: 300, height: 12, baselineTop: 310, width: 120,
        font: 'legalSerif', fontSize: 12, minFontSize: 6
      });
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      var found = result.errors.filter(function (error) {
        return error.code === 'min-font-size';
      })[0];
      assert(found, 'no min-font-size error raised');
      equal(found.message, 'Минимальный размер ниже допустимых 9 pt');
    });
    add('Every imported production map already satisfies the 9 pt floor', function () {
      var offenders = [];
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        (map.fields || []).forEach(function (field) {
          if ((field.type || 'text') === 'check') return;
          if (Number(field.minFontSize) < 9 || Number(field.fontSize) < 9) {
            offenders.push(map.id + '/' + field.id);
          }
        });
      });
      equal(offenders.length, 0, 'below the floor: ' + offenders.slice(0, 5).join(', '));
    });
    add('Adding a continuation line builds ordered flow regions', function () {
      return app.openExisting('accession-application-fl').then(function () {
        var field = app.state.project.fields.filter(function (item) {
          return item.id === 'clientFullName';
        })[0];
        app.state.selectField(field.id);
        var regions = ns.schema.flowRegions(field);
        equal(regions.length, 1, 'starts with its own slot');
        app.inspector.render();
        var suggestion = ns.schema.suggestContinuation(field, regions, { withUnderline: true });
        assert(suggestion.baselineTop > field.baselineTop, 'the next line sits below');
        equal(suggestion.reviewStatus, 'suggested', 'never approved automatically');
        equal(suggestion.drawUnderline, true, 'a full line carries its rule');
        assert(suggestion.underlineThickness > 0, 'rule thickness suggested');
      });
    });
    add('An unconfirmed generated line blocks production export', function () {
      var project = cloneProject(app.state.project);
      var field = project.fields.filter(function (item) { return item.id === 'clientFullName'; })[0];
      field.overflowStrategy = 'flow';
      field.flowRegions = [
        { page: 0, left: field.left, baselineTop: field.baselineTop, width: field.width, maxLines: 1 },
        { page: 0, left: 56.6, baselineTop: 300, width: 400, maxLines: 1,
          generated: true, drawUnderline: true, underlineThickness: 0.36,
          reviewStatus: 'suggested' }
      ];
      var blocked = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(blocked.errors.some(function (error) {
        return error.code === 'flow-region-unreviewed';
      }), 'unconfirmed line did not block export');

      field.flowRegions[1].reviewStatus = 'approved';
      var allowed = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(!allowed.errors.some(function (error) {
        return error.code === 'flow-region-unreviewed';
      }), 'approved line still blocked');
    });
    add('Overlapping continuation lines are rejected', function () {
      var project = cloneProject(app.state.project);
      var field = project.fields.filter(function (item) { return item.id === 'clientFullName'; })[0];
      field.overflowStrategy = 'flow';
      field.flowRegions = [
        { page: 0, left: 60, baselineTop: 300, width: 200, maxLines: 1 },
        { page: 0, left: 60, baselineTop: 301, width: 200, maxLines: 1,
          reviewStatus: 'approved' }
      ];
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'flow-region-overlap';
      }), 'overlap not detected');
    });
    add('Continuation lines survive a builder JSON round trip', function () {
      return app.openExisting('accession-application-fl').then(function () {
        var text = ns.io.exportProject(app.state.project);
        var imported = ns.io.importProjectText(text).project;
        assert(ns.io.semanticEqual(app.state.project, imported), 'project changed');
        var source = app.state.project.fields.filter(function (item) {
          return Array.isArray(item.flowRegions);
        });
        assert(source.length > 0, 'the fixture map has no continuation lines to test');
        source.forEach(function (field) {
          var round = imported.fields.filter(function (item) { return item.id === field.id; })[0];
          assert(ns.io.semanticEqual(round.flowRegions, field.flowRegions),
            'flowRegions changed for ' + field.id);
          equal(round.overflowStrategy, field.overflowStrategy, 'strategy changed');
        });
      });
    });
    add('Continuation lines survive a production JS round trip', function () {
      var map = frame.CRMDocumentEngine.fieldMaps['accession-application-fl'];
      var project = ns.schema.fromProduction(map, app.catalog.filter(function (entry) {
        return entry.overlayTemplateId === 'accession-application-fl';
      })[0]);
      var exported = ns.schema.toProduction(project);
      var withFlow = (map.fields || []).filter(function (field) {
        return Array.isArray(field.flowRegions);
      });
      assert(withFlow.length >= 3, 'expected continuation lines in the fixture map');
      withFlow.forEach(function (field) {
        var round = exported.fields.filter(function (item) { return item.id === field.id; })[0];
        assert(ns.io.semanticEqual(round.flowRegions, field.flowRegions),
          'flowRegions changed for ' + field.id);
      });
    });
    add('Deleting a continuation line keeps the logical field', function () {
      return app.openExisting('accession-application-fl').then(function () {
        var before = app.state.project.fields.length;
        var field = app.state.project.fields.filter(function (item) {
          return item.id === 'registrationAddress';
        })[0];
        assert(Array.isArray(field.flowRegions), 'fixture field has no continuation');
        app.state.updateField(field.id, { flowRegions: undefined, overflowStrategy: undefined },
          'qa remove continuation');
        var after = app.state.project.fields.filter(function (item) {
          return item.id === 'registrationAddress';
        })[0];
        assert(after, 'the field was removed with its continuation line');
        equal(app.state.project.fields.length, before, 'field count changed');
      });
    });

    // ── Page-section expansion ────────────────────────────────────────────
    add('A suggested expansion is never approved automatically', function () {
      return app.openExisting('qualification-notice').then(function () {
        var field = app.state.project.fields.filter(function (item) {
          return item.id === 'recognitionDate';
        })[0];
        var suggestion = ns.schema.suggestExpansion(field, { width: 595.32, height: 841.92 }, {});
        equal(suggestion.reviewStatus, 'suggested', 'review status');
        equal(suggestion.page, field.page, 'page');
        assert(suggestion.insertionTop > field.baselineTop, 'anchor sits below the field');
        assert(suggestion.line.width > 0, 'the row has a width');
        assert(suggestion.line.ruleThickness > 0, 'the row has a rule');
      });
    });
    add('An unreviewed expansion blocks production export', function () {
      var project = cloneProject(app.state.project);
      var field = project.fields.filter(function (item) { return item.id === 'recognitionDate'; })[0];
      field.overflowStrategy = 'expand-layout';
      field.expansion = ns.schema.suggestExpansion(field, { width: 595.32, height: 841.92 },
        { bottomReserve: 100 });
      var blocked = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(blocked.errors.some(function (error) {
        return error.code === 'expansion-unreviewed';
      }), 'unreviewed expansion did not block export');
      field.expansion.reviewStatus = 'approved';
      var allowed = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(!allowed.errors.some(function (error) {
        return error.code === 'expansion-unreviewed';
      }), 'approved expansion still blocked');
    });
    add('The inspector edits the page budget where it belongs', function () {
      return app.openExisting('power-of-attorney').then(function () {
        app.state.selectField('ulOgrn');
        var inspector = frame.document.getElementById('dtb-inspector');
        var titles = Array.prototype.map.call(
          inspector.querySelectorAll('.dtb-inspector-section h3'),
          function (node) { return node.textContent; });
        assert(titles.some(function (t) { return /Запас страницы/.test(t); }),
               'no page-budget section for an anchor field');
        assert(titles.some(function (t) { return /Расширение страницы/.test(t); }),
               'no expansion section for an anchor field');
        var hints = Array.prototype.map.call(
          inspector.querySelectorAll('.dtb-inspector-hint'),
          function (node) { return node.textContent; }).join(' ');
        assert(/0 строк/.test(hints) && /максимум/.test(hints),
               'no zero/one/maximum row preview');
        assert(/Ещё на этой странице/.test(hints),
               'no cumulative preview for the other anchors of the page');
        assert(/из просветов/.test(hints),
               'the recoverable white space is not shown');

        // Editing it goes to the page, not to the field.
        var before = app.state.project.pageLayout[0].bottomClearance;
        app.state.update({
          pageLayout: Object.assign({}, app.state.project.pageLayout, {
            0: Object.assign({}, app.state.project.pageLayout[0],
                             { bottomClearance: before + 1 })
          })
        }, 'qa page budget');
        equal(app.state.project.pageLayout[0].bottomClearance, before + 1,
              'page budget did not change');
        assert(app.state.field('ulOgrn').expansion.bottomReserve === undefined,
               'the anchor grew a reserve of its own');
        app.state.undo();
        equal(app.state.project.pageLayout[0].bottomClearance, before,
              'undo did not restore the page budget');
      }).then(function () { return app.openExisting('qualification-notice'); });
    });
    add('A row taller than the whole page budget is rejected', function () {
      var project = cloneProject(app.state.project);
      // Leave the page just under one row of room.
      project.pageLayout[0].bottomClearance =
        841.92 - project.pageLayout[0].bodyBottom - 10;
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'page-layout-reserve';
      }), 'a row the page cannot pay for was accepted');
    });
    add('A page budget is stated once, not per field', function () {
      var project = cloneProject(app.state.project);
      var field = project.fields.filter(function (item) {
        return item.id === 'clientName';
      })[0];
      field.expansion.bottomReserve = 250;
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'expansion-reserve-duplicated';
      }), 'a per-field reserve shadowed the page budget');
    });
    add('An anchor missing from the page budget is rejected', function () {
      var project = cloneProject(app.state.project);
      project.pageLayout[0].anchors = project.pageLayout[0].anchors.filter(
        function (id) { return id !== 'clientName'; });
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'expansion-not-anchored';
      }), 'an unlisted anchor was accepted');
    });
    add('A movable block reaching the fixed footer is rejected', function () {
      var project = cloneProject(app.state.project);
      project.pageLayout[0].fixedFooterFrom = 700;
      project.pageLayout[0].shiftToTop = 780;
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'page-layout-footer';
      }), 'a page number would have moved');
    });
    add('An unreviewed compaction zone blocks production export', function () {
      var project = cloneProject(app.state.project);
      project.pageLayout[0].compaction = [
        { top: 100, originalGap: 20, minGap: 8, reviewStatus: 'suggested' }
      ];
      var blocked = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(blocked.errors.some(function (error) {
        return error.code === 'compaction-unreviewed';
      }), 'unreviewed whitespace recovery did not block export');
      project.pageLayout[0].compaction[0].reviewStatus = 'approved';
      var allowed = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(!allowed.errors.some(function (error) {
        return error.code === 'compaction-unreviewed';
      }), 'approved whitespace recovery still blocked');
    });
    add('A compaction minimum larger than its gap is rejected', function () {
      var project = cloneProject(app.state.project);
      project.pageLayout[0].compaction = [
        { top: 100, originalGap: 8, minGap: 20, reviewStatus: 'approved' }
      ];
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'compaction-minimum';
      }), 'an impossible compaction minimum was accepted');
    });
    add('The page budget survives export, import and production export', function () {
      var text = ns.io.exportProject(app.state.project);
      var imported = ns.io.importProjectText(text).project;
      assert(ns.io.semanticEqual(imported.pageLayout, app.state.project.pageLayout),
             'builder JSON lost the page budget');
      var production = ns.schema.toProduction(app.state.project);
      assert(ns.io.semanticEqual(production.pageLayout, app.state.project.pageLayout),
             'production export lost the page budget');
      var back = ns.schema.fromProduction(production, null);
      assert(ns.io.semanticEqual(back.pageLayout, app.state.project.pageLayout),
             'reimport lost the page budget');
      assert(!Object.prototype.hasOwnProperty.call(back.productionProperties, 'pageLayout'),
             'the page budget is a project property, not an opaque passenger');
    });
    add('Reviewed cross-page flow is editable, validated and round-trips', function () {
      return app.openExisting('power-of-attorney').then(function () {
        app.state.selectField('ulOgrn');
        var flow = app.state.project.pageLayout[0].crossPageFlow;
        assert(flow && flow.reviewStatus === 'approved',
               'the production cross-page rule was not imported');
        var inspector = frame.document.getElementById('dtb-inspector');
        var text = inspector.textContent;
        assert(/Перенос между страницами/.test(text) &&
               /Исходный блок/.test(text) && /Целевая страница/.test(text),
               'the cross-page boundaries are not editable in the inspector');

        var project = cloneProject(app.state.project);
        project.pageLayout[0].crossPageFlow.reviewStatus = 'suggested';
        var unreviewed = ns.validation.structural(project, app.sourceInfo,
          ns.fixtures.payloadFor('ru-company-long', project));
        assert(unreviewed.errors.some(function (error) {
          return error.code === 'cross-page-unreviewed';
        }), 'an unreviewed cross-page move did not block export');

        delete project.pageLayout[0].crossPageFlow.sourceFromTop;
        var incomplete = ns.validation.structural(project, app.sourceInfo,
          ns.fixtures.payloadFor('ru-company-long', project));
        assert(incomplete.errors.some(function (error) {
          return error.code === 'cross-page-incomplete';
        }), 'incomplete operator-block boundaries were accepted');

        var skippedPage = cloneProject(app.state.project);
        skippedPage.pageLayout[0].crossPageFlow.targetPage = 2;
        var invalidTarget = ns.validation.structural(skippedPage, app.sourceInfo,
          ns.fixtures.payloadFor('ru-company-long', skippedPage));
        assert(invalidTarget.errors.some(function (error) {
          return error.code === 'cross-page-target';
        }), 'a transfer that skips the following page was accepted');

        var undocumented = cloneProject(app.state.project);
        undocumented.pageLayout[0].crossPageFlow.note = '';
        var missingNote = ns.validation.structural(undocumented, app.sourceInfo,
          ns.fixtures.payloadFor('ru-company-long', undocumented));
        assert(missingNote.errors.some(function (error) {
          return error.code === 'cross-page-note';
        }), 'an undocumented cross-page move was accepted');

        var exported = ns.schema.toProduction(app.state.project);
        var back = ns.schema.fromProduction(exported, null);
        assert(ns.io.semanticEqual(back.pageLayout[0].crossPageFlow, flow),
               'cross-page flow changed in production round trip');
      }).then(function () { return app.openExisting('qualification-notice'); });
    });
    add('Every production map round-trips its page budget', function () {
      var flowCount = 0;
      app.catalog.forEach(function (entry) {
        var template = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        var project = ns.schema.fromProduction(template, entry);
        var back = ns.schema.toProduction(project, template.templateUrl);
        assert(ns.io.semanticEqual(back.pageLayout || null, template.pageLayout || null),
               'page budget lost for ' + template.id);
        if (template.pageLayout) {
          Object.keys(template.pageLayout).forEach(function (page) {
            if (template.pageLayout[page].crossPageFlow) flowCount += 1;
            (template.pageLayout[page].anchors || []).forEach(function (id) {
              assert((back.fields || []).some(function (f) { return f.id === id; }),
                     template.id + ': anchor ' + id + ' lost');
            });
          });
        }
      });
      equal(flowCount, 3, 'not every reviewed production cross-page rule was audited');
    });
    add('An incomplete expansion is rejected rather than guessed', function () {
      var project = cloneProject(app.state.project);
      var field = project.fields.filter(function (item) { return item.id === 'recognitionDate'; })[0];
      field.overflowStrategy = 'expand-layout';
      field.expansion = { page: 0, insertionTop: 400, reviewStatus: 'approved' };
      var result = ns.validation.structural(project, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.errors.some(function (error) {
        return error.code === 'expansion-incomplete';
      }), 'incomplete expansion accepted');
    });
    add('Expansion definitions survive a builder JSON round trip', function () {
      return app.openExisting('qualification-notice').then(function () {
        var text = ns.io.exportProject(app.state.project);
        var imported = ns.io.importProjectText(text).project;
        assert(ns.io.semanticEqual(app.state.project, imported), 'project changed');
        var source = app.state.project.fields.filter(function (item) { return item.expansion; });
        assert(source.length > 0, 'the fixture map has no expansion to test');
        source.forEach(function (field) {
          var round = imported.fields.filter(function (item) { return item.id === field.id; })[0];
          assert(ns.io.semanticEqual(round.expansion, field.expansion),
            'expansion changed for ' + field.id);
          equal(round.overflowStrategy, 'expand-layout', 'strategy changed');
        });
      });
    });
    add('Expansion definitions survive a production JS round trip', function () {
      var expandable = 0;
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        var project = ns.schema.fromProduction(map, entry);
        var exported = ns.schema.toProduction(project);
        (map.fields || []).forEach(function (field) {
          if (!field.expansion) return;
          expandable += 1;
          var round = exported.fields.filter(function (item) { return item.id === field.id; })[0];
          assert(ns.io.semanticEqual(round.expansion, field.expansion),
            'expansion changed for ' + map.id + '/' + field.id);
        });
      });
      assert(expandable >= 10, 'expected expandable fields across the maps: ' + expandable);
    });
    add('Every committed expansion is already visually approved', function () {
      var pending = [];
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        (map.fields || []).forEach(function (field) {
          if (field.expansion && field.expansion.reviewStatus !== 'approved') {
            pending.push(map.id + '/' + field.id);
          }
        });
      });
      equal(pending.length, 0, 'unreviewed: ' + pending.join(', '));
    });

    add('Replacement PDF comparison works', function () {
      return app.openExisting('accession-application-fl').then(function () {
        return makePdf(app.sourceInfo.pages.map(function (page) { return { width: page.width, height: page.height }; }));
      }).then(function (bytes) { return app.replacePdf(pdfFile(bytes, 'replacement-same-size.pdf')); })
        .then(function (summary) { assert(summary.oldHash !== summary.newHash); equal(summary.oldPageCount, summary.newPageCount); assert(summary.pagesRequiringReview.length > 0); });
    });
    add('Out-of-bounds replacement fields block export', function () {
      return makePdf([{width: 100,height:100},{width:100,height:100},{width:100,height:100}])
        .then(function (bytes) { return app.replacePdf(pdfFile(bytes, 'replacement-small.pdf')); })
        .then(function () {
          assert(app.state.validation.errors.some(function (error) { return error.code === 'out-of-bounds'; }));
          var expectedErrorIndex = frame.__qaConsoleErrors.length;
          assert(!app.productionExportAllowed());
          frame.__qaConsoleErrors.splice(expectedErrorIndex);
        });
    });
    add('Unused wizard field is reported', function () {
      var project = cloneProject(app.state.project); project.wizard.fields.push({ key: 'qa-unused', label: 'Unused', type: 'text' });
      var result = ns.validation.structural(project, app.sourceInfo, ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.warnings.some(function (warning) { return warning.code === 'unused-wizard'; }));
    });
    add('Missing required source is reported', function () {
      var project = cloneProject(app.state.project); project.fields.push({ id: 'qa-missing', type: 'text', source: 'extra.qa-missing-provider', page: 0, left: 1, top: 1, height: 10, baselineTop: 9, width: 20, font: 'legalSerif', fontSize: 8, minFontSize: 6, required: true });
      var result = ns.validation.structural(project, app.sourceInfo, { subject: {}, fields: {}, extraValues: {}, checks: {} });
      assert(result.errors.some(function (error) { return error.code === 'unresolved-wizard-source' || error.code === 'missing-required'; }));
    });
    add('No external network requests are allowed', function () {
      var project = cloneProject(app.state.project);
      project.fonts.externalQaFont = 'https://example.com/private.ttf';
      return app.safeFetch('https://example.com/private.pdf')
        .then(function () { throw new Error('External fetch was allowed'); }, function (error) { assert(/запрещены/.test(error.message)); })
        .then(function () {
          return ns.validation.loadProjectFonts(project)
            .then(function () { throw new Error('External font fetch was allowed'); }, function (error) { assert(/Внешний URL шрифта запрещён/.test(error.message)); });
        });
    });
    add('No console errors occur in a successful run', function () { equal(frame.__qaConsoleErrors.length, 0, 'console.error calls'); });

    function cloneProject(project) { return ns.schema.clone(project); }

    function run() {
      var chain = Promise.resolve();
      tests.forEach(function (test, index) {
        chain = chain.then(function () {
          return Promise.resolve().then(test.fn).then(function () {
            results.push({ number: index + 1, name: test.name, pass: true, details: 'OK' });
          }, function (error) {
            results.push({ number: index + 1, name: test.name, pass: false, details: error && error.message || String(error) });
          }).then(render);
        });
      });
      return chain.then(finish);
    }

    function render() {
      var body = document.getElementById('results'); body.textContent = '';
      results.forEach(function (result) {
        var row = body.insertRow(); row.insertCell().textContent = result.number; row.insertCell().textContent = result.name;
        var status = row.insertCell(); status.textContent = result.pass ? 'PASS' : 'FAIL'; status.className = result.pass ? 'pass' : 'fail';
        row.insertCell().textContent = result.details;
      });
      var passed = results.filter(function (result) { return result.pass; }).length;
      document.getElementById('summary').textContent = passed + '/' + results.length + ' passed';
    }

    function finish() {
      var passed = results.filter(function (result) { return result.pass; }).length;
      var report = { total: results.length, passed: passed, failed: results.length - passed, results: results };
      document.getElementById('qa-output').textContent = 'QA_JSON_START' + JSON.stringify(report) + 'QA_JSON_END';
      document.documentElement.dataset.qaComplete = 'true';
      document.title = passed === results.length ? 'DONE · Builder QA' : 'FAILED · Builder QA';
    }

    document.getElementById('builder').addEventListener('load', function () {
      frame = this.contentWindow;
      ns = frame.CRMDocumentBuilder;
      if (!ns || !ns.app) { document.getElementById('summary').textContent = 'Builder did not initialize.'; return; }
      var originalError = frame.console.error.bind(frame.console);
      frame.__qaConsoleErrors = [];
      frame.console.error = function () { frame.__qaConsoleErrors.push(Array.prototype.join.call(arguments, ' ')); originalError.apply(null, arguments); };
      ns.app.readyPromise.then(function () { app = ns.app; run(); }, function (error) { document.getElementById('summary').textContent = error.message; });
    });
  }());
  </script>
</body>
</html>
