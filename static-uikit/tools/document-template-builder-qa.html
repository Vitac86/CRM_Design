<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Document Template Builder · QA</title>
  <link rel="icon" href="../assets/icons/favicon_blue.ico"/>
  <style>
    body { margin: 20px; color: #1e293b; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 20px; }
    #summary { margin: 10px 0; padding: 10px; border-radius: 5px; background: #eef2f7; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d7dee8; padding: 5px 7px; text-align: left; }
    .pass { color: #087443; } .fail { color: #b42318; }
    iframe { position: fixed; left: -20000px; width: 1440px; height: 900px; border: 0; }
    #qa-output { display: none; }
  </style>
</head>
<body>
  <h1>Document Template Builder · automated browser QA</h1>
  <p>Runs against the actual builder, local PDF.js worker, production renderer and all committed maps.</p>
  <div id="summary">Starting…</div>
  <table><thead><tr><th>#</th><th>Test</th><th>Result</th><th>Details</th></tr></thead><tbody id="results"></tbody></table>
  <pre id="qa-output"></pre>
  <iframe id="builder" src="document-template-builder.html?embeddedQa=1" title="Builder under test"></iframe>
  <script>
  (function () {
    'use strict';
    var tests = [];
    var results = [];
    var frame;
    var app;
    var ns;

    function add(name, fn) { tests.push({ name: name, fn: fn }); }
    function assert(value, message) { if (!value) throw new Error(message || 'Assertion failed'); }
    function equal(a, b, message) { if (a !== b) throw new Error((message || 'Values differ') + ': ' + a + ' !== ' + b); }
    function pdfFile(bytes, name) { return new frame.File([bytes], name || 'replacement.pdf', { type: 'application/pdf' }); }
    function makePdf(sizes) {
      return frame.PDFLib.PDFDocument.create().then(function (doc) {
        sizes.forEach(function (size) { doc.addPage(frame.Array.of(Number(size.width), Number(size.height))); });
        return doc.save();
      });
    }
    function currentField() { return app.state.field(); }
    function expansionOwners(project) {
      return (project.fields || []).concat(project.wordFlowBlocks || []).filter(function (owner) {
        return !!owner.expansion;
      });
    }
    function layoutOwner(project, id) {
      return (project.fields || []).concat(project.wordFlowBlocks || []).find(function (owner) {
        return owner.id === id;
      });
    }
    function identifierError(fn) {
      var caught = null;
      try { fn(); } catch (error) { caught = error; }
      assert(caught, 'Identifier protection error expected');
      equal(caught.name, 'IdentifierProtectionError');
      equal(caught.message, ns.identifierProtection.WARNING);
      return caught;
    }

    add('Builder opens through HTTP', function () { assert(/^https?:$/.test(frame.location.protocol)); assert(app.ready); });
    add('file:// blocker has the required message', function () { equal(ns.constants.protocolMessage, 'Конструктор должен быть открыт через локальный HTTP-сервер.'); });
    add('Existing template catalog loads', function () { assert(app.catalogAudit && !app.catalogAudit.pdfFailures.length); });
    add('All 18 maps are discoverable and open', function () {
      equal(app.catalog.length, 18); equal(Object.keys(frame.CRMDocumentEngine.fieldMaps).length, 18);
      var opened = [];
      var chain = Promise.resolve();
      app.catalog.forEach(function (entry) {
        chain = chain.then(function () { return app.openExisting(entry.overlayTemplateId); })
          .then(function () {
            assert(!app.state.validation.warnings.some(function (warning) { return warning.code === 'unused-wizard'; }), 'False unused wizard source: ' + entry.overlayTemplateId);
            opened.push(entry.overlayTemplateId);
          });
      });
      return chain.then(function () { equal(opened.length, 18); });
    });
    add('A multi-page PDF renders', function () { return app.openExisting('accession-application-fl').then(function () { equal(app.viewer.pages.length, 3); assert(app.viewer.canvas.width > 0); }); });
    add('A mixed-page-size PDF renders correctly', function () {
      return makePdf([{width: 595, height: 842}, {width: 842, height: 595}]).then(function (bytes) { return app.viewer.load(bytes, 'mixed-size.pdf'); })
        .then(function (info) { equal(info.pageCount, 2); assert(info.pages[0].width !== info.pages[1].width); return app.openExisting('accession-application-fl'); });
    });
    add('Selecting a field opens its properties', function () { var id = app.state.project.fields[0].id; app.state.selectField(id); equal(currentField().id, id); assert(frame.document.querySelector('#dtb-inspector h2')); });
    add('Moving a field changes PDF-point coordinates', function () { var field = currentField(); var before = field.left; app.state.updateField(field.id, { left: before + 1 }, 'qa move'); equal(currentField().left, before + 1); });
    add('Undo restores old coordinates', function () { var after = currentField().left; app.state.undo(); equal(currentField().left, after - 1); });
    add('Redo reapplies the move', function () { var before = currentField().left; app.state.redo(); equal(currentField().left, before + 1); });
    add('Keyboard nudge works at 0.25 pt', function () { var before = currentField().left; frame.document.body.dispatchEvent(new frame.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })); equal(currentField().left, before + 0.25); });
    add('Field resize works from keyboard', function () { var before = currentField().width; frame.document.body.dispatchEvent(new frame.KeyboardEvent('keydown', { key: 'ArrowRight', altKey: true, bubbles: true })); equal(currentField().width, before + 0.25); });
    add('Text baseline editing works', function () { var field = currentField(); var before = field.baselineTop; app.state.updateField(field.id, { baselineTop: before + 0.25 }, 'qa baseline'); equal(currentField().baselineTop, before + 0.25); });
    add('Checkbox editing works', function () { var check = app.state.project.fields.find(function (field) { return field.type === 'check'; }); assert(check); app.state.selectField(check.id); app.state.updateField(check.id, { markStyle: 'cross', boxSize: 7.5 }, 'qa checkbox'); equal(currentField().markStyle, 'cross'); });
    add('Existing field IDs and sources are frozen and read-only', function () {
      var field = app.state.project.fields.find(function (item) { return (item.type || 'text') !== 'static' && item.source; });
      var originalId = field.id;
      var originalSource = field.source;
      var beforeCount = app.state.project.fields.length;
      app.state.selectField(originalId);
      var idControl = frame.document.querySelector('[data-identifier-role="field-id"]');
      var sourceControl = frame.document.querySelector('[data-identifier-role="field-source"]');
      assert(idControl && idControl.readOnly, 'existing field ID must be read-only');
      assert(sourceControl && sourceControl.readOnly, 'existing field source must be read-only');
      assert(Array.from(frame.document.querySelectorAll('#dtb-inspector .dtb-identifier-warning')).some(function (node) {
        return node.textContent.trim() === ns.identifierProtection.WARNING;
      }), 'exact identifier warning is missing');
      equal(app.state.updateField(originalId, { id: originalId + '-renamed' }, 'qa forbidden id'), false);
      assert(app.state.field(originalId), 'original field ID must survive a rejected rename');
      equal(app.state.updateField(originalId, { source: originalSource + '.renamed' }, 'qa forbidden source'), false);
      equal(app.state.field(originalId).source, originalSource);
      app.state.selectField(originalId);
      equal(app.state.deleteSelected(), false);
      equal(app.state.project.fields.length, beforeCount);
    });
    add('Template, wizard and check keys are frozen and read-only', function () {
      var project = app.state.project;
      var originalTemplateId = project.templateId;
      var templateControl = frame.document.querySelector('#dtb-meta-id');
      assert(templateControl.readOnly, 'existing template ID must be read-only');
      equal(frame.document.querySelector('#dtb-meta-id-warning').textContent.trim(), ns.identifierProtection.WARNING);
      equal(app.state.update({ templateId: originalTemplateId + '-renamed' }, 'qa forbidden template id'), false);
      equal(app.state.project.templateId, originalTemplateId);

      [['fields', 'extra.'], ['checkFields', 'check.']].forEach(function (definition) {
        var group = definition[0];
        var prefix = definition[1];
        var match = null;
        (app.state.project.wizard[group] || []).some(function (control, index) {
          var field = app.state.project.fields.find(function (item) { return item.source === prefix + control.key; });
          if (!field) return false;
          match = { control: control, index: index, field: field };
          return true;
        });
        assert(match, 'mapped ' + group + ' control expected');
        app.state.selectField(match.field.id);
        var keyControl = frame.document.querySelector('[data-identifier-role="wizard-key"]');
        assert(keyControl && keyControl.readOnly, group + ' key must be read-only');
        var originalKey = match.control.key;
        var changed = app.state.commit('qa forbidden ' + group + ' key', function (candidate) {
          candidate.wizard[group][match.index].key = originalKey + '-renamed';
        });
        equal(changed, false);
        equal(app.state.project.wizard[group][match.index].key, originalKey);
      });
    });
    add('New field identifiers remain editable', function () {
      var seed = ns.schema.clone(app.state.project.fields.find(function (field) {
        return (field.type || 'text') !== 'check' && (field.type || 'text') !== 'static';
      }));
      var originalSelection = seed.id;
      seed.id = app.state.uniqueFieldId('qa-added-field');
      seed.source = 'subject.displayName';
      equal(app.state.addField(seed), true);
      var renamed = seed.id + '-renamed';
      equal(app.state.updateField(seed.id, { id: renamed }, 'qa rename new id'), true);
      equal(app.state.updateField(renamed, { source: 'subject.email' }, 'qa change new source'), true);
      equal(app.state.field(renamed).source, 'subject.email');
      var entry = app.catalog.find(function (item) { return item.overlayTemplateId === app.state.project.templateId; });
      var productionRoundTrip = ns.schema.fromProduction(ns.schema.toProduction(app.state.project), entry);
      var reloaded = new ns.BuilderState();
      reloaded.setProject(productionRoundTrip);
      assert(reloaded.field(renamed), 'new field must survive production import');
      assert(!ns.identifierProtection.isFieldProtected(reloaded.project, renamed),
        'an additive field must not become a frozen production identifier');
      app.state.selectField(renamed);
      equal(app.state.deleteSelected(), true);
      assert(!app.state.field(renamed));
      app.state.selectField(originalSelection);
    });
    add('showWhen editing works', function () { var field = app.state.project.fields.find(function (item) { return (item.type || 'text') !== 'static'; }); app.state.selectField(field.id); app.state.updateField(field.id, { showWhen: { source: 'subject.kind', equals: 'individual' } }, 'qa condition'); equal(currentField().showWhen.equals, 'individual'); });
    add('Russian test data renders', function () { app.state.profileId = 'ru-resident-normal'; app.state.payloadOverrides = {}; return app.openExisting('accession-application-fl').then(function () { app.state.profileId = 'ru-resident-normal'; return app.generatePreview(); }).then(function (result) { assert(result.blob.size > 1000); }); });
    add('English test data renders', function () { app.state.profileId = 'en-nonresident-normal'; app.state.payloadOverrides = {}; return app.generatePreview().then(function (result) { assert(result.blob.size > 1000); }); });
    add('Long values use production fit logic', function () { return ns.validation.analyzeProfile(app.state.project, 'ru-resident-long', {}).then(function (fit) { assert(fit.fields.length === app.state.project.fields.length); assert(frame.CRMDocumentEngine.textLayout.fitText); }); });
    add('Unsupported glyph produces a clear error', function () {
      var payload = ns.fixtures.payloadFor('ru-resident-normal', app.state.project, {});
      var field = app.state.project.fields.find(function (item) {
        return (item.type || 'text') !== 'check' && item.source &&
          item.layoutMode !== 'flow-reference' && ns.validation.visible(item, payload);
      });
      var overrides = {}; overrides[field.source] = '测试';
      return ns.validation.analyzeProfile(app.state.project, 'ru-resident-normal', overrides).then(function (fit) {
        var result = fit.fields.find(function (entry) { return entry.fieldId === field.id; }).result;
        equal(result.status, 'unsupported-glyph'); assert(/^U\+/.test(result.unsupported[0].unicode));
      });
    });
    add('Real PDF preview generates', function () { app.state.profileId = 'ru-resident-normal'; app.state.payloadOverrides = {}; return app.generatePreview().then(function (result) { assert(result.blob instanceof frame.Blob); }); });
    add('Preview has the correct page count', function () { equal(app.previewInspection.pageCount, app.state.project.expectedPages); assert(app.previewInspection.noAppendedPages); });
    add('Preview has zero AcroForm fields', function () { equal(app.previewInspection.acroFormFields, 0); });
    add('Preview has zero widgets', function () { equal(app.previewInspection.widgets, 0); });
    add('Stale Blob URLs are revoked', function () { var old = app.previewUrl; return app.generatePreview().then(function () { assert(app.revokedUrls.indexOf(old) !== -1); }); });
    add('Builder JSON export/import round-trips', function () { var text = ns.io.exportProject(app.state.project); var imported = ns.io.importProjectText(text).project; assert(ns.io.semanticEqual(app.state.project, imported)); });
    add('Tampered identifiers are rejected by validation and every export path', function () {
      var tampered = ns.schema.clone(app.state.project);
      var protectedField = tampered.identifierProtection.fields.find(function (field) { return field.source !== null; });
      tampered.fields.find(function (field) { return field.id === protectedField.id; }).source += '.renamed';
      identifierError(function () { ns.io.exportProject(tampered); });
      identifierError(function () { ns.schema.toProduction(tampered); });
      identifierError(function () { ns.io.registryFragment(tampered); });
      identifierError(function () { ns.io.exportFixtures(tampered); });
      identifierError(function () { ns.io.exportQa(tampered, null, null); });
      assert(ns.validation.structural(tampered).errors.some(function (error) {
        return error.code === 'protected-field-source';
      }), 'structural validation must expose the protected source error');
      var legacy = ns.schema.clone(app.state.project);
      delete legacy.identifierProtection;
      ns.identifierProtection.attach(legacy);
      assert(legacy.identifierProtection, 'known legacy project must receive the runtime baseline');
      var legacyTamper = ns.schema.clone(tampered);
      delete legacyTamper.identifierProtection;
      identifierError(function () { ns.identifierProtection.attach(legacyTamper); });
    });
    add('Production JS export is deterministic', function () { var a = ns.io.productionJs(app.state.project); var b = ns.io.productionJs(app.state.project); equal(a, b); assert(!/function\s*\(/.test(a.replace(/\(function \(global\)/, ''))); });
    add('Existing-map semantic round-trip succeeds for 18 maps', function () {
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        var project = ns.schema.fromProduction(map, entry);
        var exported = ns.schema.toProduction(project);
        assert(ns.io.semanticEqual(map, exported), 'Round-trip failed: ' + map.id);
      });
    });
    add('All 18 identifier sets survive Builder JSON and production round-trips', function () {
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        var project = ns.schema.fromProduction(map, entry);
        var before = ns.identifierProtection.currentProjectIdentifiers(project);
        var imported = ns.io.importProjectText(ns.io.exportProject(project)).project;
        var after = ns.identifierProtection.currentProjectIdentifiers(imported);
        assert(ns.io.semanticEqual(before, after), 'Builder JSON changed identifiers: ' + map.id);
        var production = ns.schema.toProduction(imported);
        project.identifierProtection.fields.forEach(function (required) {
          var actual = production.fields.find(function (field) { return field.id === required.id; });
          assert(actual, 'Production round-trip removed field: ' + map.id + '/' + required.id);
          equal(actual.source == null ? null : String(actual.source), required.source,
            'Production round-trip changed source: ' + map.id + '/' + required.id);
        });
      });
    });
    // ── Reviewed Word-like blocks ────────────────────────────────────────
    add('Word-flow blocks are first-class and round-trip every production map', function () {
      var blockCount = 0;
      var referenceCount = 0;
      app.catalog.forEach(function (entry) {
        var map = frame.CRMDocumentEngine.fieldMaps[entry.overlayTemplateId];
        var project = ns.schema.fromProduction(map, entry);
        blockCount += (map.wordFlowBlocks || []).length;
        referenceCount += (map.fields || []).filter(function (field) {
          return field.layoutMode === 'flow-reference';
        }).length;
        assert(ns.io.semanticEqual(project.wordFlowBlocks, map.wordFlowBlocks || []),
          'first-class import changed blocks: ' + map.id);
        assert(!Object.prototype.hasOwnProperty.call(project.productionProperties, 'wordFlowBlocks'),
          'blocks remained opaque: ' + map.id);
        var imported = ns.io.importProjectText(ns.io.exportProject(project)).project;
        assert(ns.io.semanticEqual(imported.wordFlowBlocks, project.wordFlowBlocks),
          'Builder JSON changed blocks: ' + map.id);
        var production = ns.schema.toProduction(imported);
        assert(ns.io.semanticEqual(production.wordFlowBlocks || [], map.wordFlowBlocks || []),
          'production export changed blocks: ' + map.id);
        (production.wordFlowBlocks || []).forEach(function (block) {
          assert(block.fontSizeLocked, map.id + '/' + block.id + ': font is not locked');
          equal(Number(block.minFontSize), Number(block.fontSize),
            map.id + '/' + block.id + ': locked size changed');
        });
      });
      assert(blockCount > 0, 'no production Word-flow blocks discovered');
      assert(referenceCount > 0, 'no flow-reference fields discovered');
    });
    add('Legacy opaque Word-flow metadata migrates into the Builder schema', function () {
      var map = frame.CRMDocumentEngine.fieldMaps['power-of-attorney'];
      var entry = app.catalog.find(function (item) { return item.overlayTemplateId === map.id; });
      var legacy = ns.schema.fromProduction(map, entry);
      legacy.productionProperties.wordFlowBlocks = ns.schema.clone(legacy.wordFlowBlocks);
      delete legacy.wordFlowBlocks;
      var migrated = ns.io.importProjectText(JSON.stringify(legacy)).project;
      assert(ns.io.semanticEqual(migrated.wordFlowBlocks, map.wordFlowBlocks),
        'legacy Word-flow metadata was lost');
      assert(!Object.prototype.hasOwnProperty.call(migrated.productionProperties, 'wordFlowBlocks'),
        'legacy metadata was not promoted');
    });
    add('Word-flow editor exposes frame, typography, expansion, range and run controls', function () {
      return app.openExisting('power-of-attorney').then(function () {
        var block = app.state.project.wordFlowBlocks.find(function (candidate) {
          return !!candidate.expansion;
        }) || app.state.project.wordFlowBlocks[0];
        assert(block, 'power-of-attorney Word-flow block expected');
        app.state.selectWordFlowBlock(block.id);
        var editor = frame.document.getElementById('dtb-word-flow-editor');
        assert(!editor.hidden, 'Word-flow editor is hidden');
        assert(frame.document.getElementById('dtb-inspector').hidden,
          'field inspector must yield to block editor');
        ['id', 'frame-left', 'frame-baselineTop', 'frame-width',
          'fontSize', 'fontSizeLocked', 'lineHeight', 'paragraphSpacingAfter',
          'sourceReplacement-firstBlock', 'sourceReplacement-lastBlock',
          'sourceReplacement-expectedSha256', 'sourceReplacement-expectedTemplateSha256']
          .forEach(function (name) {
            assert(editor.querySelector('[data-word-flow-control="' + name + '"]'),
              'missing Word-flow control: ' + name);
          });
        var addTypes = Array.from(editor.querySelector('[data-word-flow-control="add-run-type"]').options)
          .map(function (option) { return option.value; });
        ['static', 'fieldRef', 'space', 'lineBreak', 'paragraphBreak', 'spacer']
          .forEach(function (type) { assert(addTypes.indexOf(type) !== -1, 'missing run type: ' + type); });
        assert(frame.document.querySelector('#dtb-word-flow-field-options option[value="ulCity"]'),
          'existing field ID search is not populated');
        assert(frame.document.querySelector('[data-word-flow-block-id="' + block.id + '"]'),
          'block list/canvas selection target is missing');

        var originalBlockId = block.id;
        var renamedId = originalBlockId + '-qa-rename';
        var referenced = block.runs.find(function (run) { return run.type === 'fieldRef'; });
        equal(app.state.updateWordFlowBlock(originalBlockId, { id: renamedId },
          'qa rename Word-flow block'), true);
        assert(app.state.wordFlowBlock(renamedId), 'renamed Word-flow block was lost');
        assert(app.state.project.pageLayout[block.page].anchors.indexOf(renamedId) !== -1,
          'page-budget anchor did not follow the block rename');
        assert(app.state.project.pageLayout[block.page].anchors.indexOf(originalBlockId) === -1,
          'stale page-budget anchor survived the block rename');
        var referencedField = app.state.field(referenced.fieldId);
        assert((Array.isArray(referencedField.flowBlockId) ? referencedField.flowBlockId :
          [referencedField.flowBlockId]).indexOf(renamedId) !== -1,
          'field flowBlockId did not follow the block rename');
        app.state.undo();
        assert(app.state.wordFlowBlock(originalBlockId), 'undo did not restore the block ID');
        app.state.selectWordFlowBlock(originalBlockId);
        equal(app.state.deleteSelectedWordFlowBlock(), true);
        assert(app.state.project.pageLayout[block.page].anchors.indexOf(originalBlockId) === -1,
          'deleting a block left a stale page-budget anchor');
        assert(!ns.schema.isWordFlowReferenced(app.state.project, referenced.fieldId),
          'deleting a block left its field reference active');
        app.state.undo();
        assert(app.state.wordFlowBlock(originalBlockId), 'undo did not restore the deleted block');
        app.state.selectWordFlowBlock(originalBlockId);
      });
    });
    add('Styled-run editing links existing fields without renaming business identifiers', function () {
      var originalProtection = ns.schema.clone(app.state.project.identifierProtection);
      var seed = ns.schema.clone(app.state.project.fields.find(function (field) {
        return field.layoutMode !== 'flow-reference' && (field.type || 'text') !== 'check';
      }));
      seed.id = app.state.uniqueFieldId('qa-word-flow-field');
      seed.source = 'subject.displayName';
      delete seed.layoutMode; delete seed.flowBlockId;
      equal(app.state.addField(seed), true);
      var blockId = app.state.uniqueWordFlowBlockId('qa-word-flow-block');
      var block = ns.schema.suggestWordFlowBlock(app.state.project, seed.page, blockId);
      block.sourceStaticText = 'Префикс значение.';
      block.runs = [
        { type: 'static', text: 'Префикс ' },
        { type: 'space' },
        { type: 'fieldRef', fieldId: seed.id, keepTogether: true,
          decoration: { underline: true, minWidth: 40, thickness: 0.36, offset: 1.2 } },
        { type: 'lineBreak' },
        { type: 'paragraphBreak' },
        { type: 'spacer', width: 12 },
        { type: 'static', text: 'значение.' }
      ];
      equal(app.state.addWordFlowBlock(block), true);
      var linked = app.state.field(seed.id);
      equal(linked.layoutMode, 'flow-reference');
      equal(linked.flowBlockId, blockId);
      equal(app.state.updateField(seed.id, { id: seed.id + '-renamed' }, 'qa forbidden ref rename'), false);
      equal(app.state.updateField(seed.id, { source: 'subject.email' }, 'qa editable new source'), true);
      equal(app.state.field(seed.id).source, 'subject.email');
      app.state.selectField(seed.id);
      equal(app.state.deleteSelected(), false);
      assert(ns.io.semanticEqual(app.state.project.identifierProtection, originalProtection),
        'Word-flow edit changed identifier protection metadata');
      var builderRound = ns.io.importProjectText(ns.io.exportProject(app.state.project)).project;
      assert(ns.io.semanticEqual(builderRound.wordFlowBlocks, app.state.project.wordFlowBlocks),
        'styled runs changed in Builder JSON');
      var entry = app.catalog.find(function (item) { return item.overlayTemplateId === app.state.project.templateId; });
      var productionRound = ns.schema.fromProduction(ns.schema.toProduction(app.state.project), entry);
      assert(ns.io.semanticEqual(productionRound.wordFlowBlocks, app.state.project.wordFlowBlocks),
        'styled runs changed in production round-trip');
      app.state.selectWordFlowBlock(blockId);
      equal(app.state.deleteSelectedWordFlowBlock(), true);
      assert(!app.state.field(seed.id).layoutMode, 'deleted block left a flow-reference marker');
      equal(app.state.updateField(seed.id, { id: seed.id + '-renamed' }, 'qa rename unlinked field'), true);
      app.state.selectField(seed.id + '-renamed');
      equal(app.state.deleteSelected(), true);
      return app.openExisting('accession-application-fl');
    });
    add('Word-flow validation rejects unlocked, missing and double-rendered references', function () {
      var base = cloneProject(app.state.project);
      var block = base.wordFlowBlocks[0];
      assert(block, 'validation fixture has no Word-flow block');
      var unlocked = cloneProject(base);
      unlocked.wordFlowBlocks[0].fontSizeLocked = false;
      var unlockedResult = ns.validation.structural(unlocked, app.sourceInfo,
        ns.fixtures.payloadFor('ru-resident-normal', unlocked));
      assert(unlockedResult.errors.some(function (error) {
        return error.code === 'word-flow' && /lock/.test(error.message);
      }), 'unlocked source font was accepted');

      var missing = cloneProject(base);

        return makePdf(app.sourceInfo.pages.map(function (page) { return { width: page.width, height: page.height }; }));
      }).then(function (bytes) { return app.replacePdf(pdfFile(bytes, 'replacement-same-size.pdf')); })
        .then(function (summary) { assert(summary.oldHash !== summary.newHash); equal(summary.oldPageCount, summary.newPageCount); assert(summary.pagesRequiringReview.length > 0); });
    });
    add('Out-of-bounds replacement fields block export', function () {
      return makePdf([{width: 100,height:100},{width:100,height:100},{width:100,height:100}])
        .then(function (bytes) { return app.replacePdf(pdfFile(bytes, 'replacement-small.pdf')); })
        .then(function () {
          assert(app.state.validation.errors.some(function (error) { return error.code === 'out-of-bounds'; }));
          var expectedErrorIndex = frame.__qaConsoleErrors.length;
          assert(!app.productionExportAllowed());
          frame.__qaConsoleErrors.splice(expectedErrorIndex);
        });
    });
    add('Unused wizard field is reported', function () {
      var project = cloneProject(app.state.project); project.wizard.fields.push({ key: 'qa-unused', label: 'Unused', type: 'text' });
      var result = ns.validation.structural(project, app.sourceInfo, ns.fixtures.payloadFor('ru-resident-normal', project));
      assert(result.warnings.some(function (warning) { return warning.code === 'unused-wizard'; }));
    });
    add('Missing required source is reported', function () {
      var project = cloneProject(app.state.project); project.fields.push({ id: 'qa-missing', type: 'text', source: 'extra.qa-missing-provider', page: 0, left: 1, top: 1, height: 10, baselineTop: 9, width: 20, font: 'legalSerif', fontSize: 8, minFontSize: 6, required: true });
      var result = ns.validation.structural(project, app.sourceInfo, { subject: {}, fields: {}, extraValues: {}, checks: {} });
      assert(result.errors.some(function (error) { return error.code === 'unresolved-wizard-source' || error.code === 'missing-required'; }));
    });
    add('No external network requests are allowed', function () {
      var project = cloneProject(app.state.project);
      project.fonts.externalQaFont = 'https://example.com/private.ttf';
      return app.safeFetch('https://example.com/private.pdf')
        .then(function () { throw new Error('External fetch was allowed'); }, function (error) { assert(/запрещены/.test(error.message)); })
        .then(function () {
          return ns.validation.loadProjectFonts(project)
            .then(function () { throw new Error('External font fetch was allowed'); }, function (error) { assert(/Внешний URL шрифта запрещён/.test(error.message)); });
        });
    });
    add('No console errors occur in a successful run', function () { equal(frame.__qaConsoleErrors.length, 0, 'console.error calls'); });

    function cloneProject(project) { return ns.schema.clone(project); }

    function run() {
      var chain = Promise.resolve();
      tests.forEach(function (test, index) {
        chain = chain.then(function () {
          return Promise.resolve().then(test.fn).then(function () {
            results.push({ number: index + 1, name: test.name, pass: true, details: 'OK' });
          }, function (error) {
            results.push({ number: index + 1, name: test.name, pass: false, details: error && error.message || String(error) });
          }).then(render);
        });
      });
      return chain.then(finish);
    }

    function render() {
      var body = document.getElementById('results'); body.textContent = '';
      results.forEach(function (result) {
        var row = body.insertRow(); row.insertCell().textContent = result.number; row.insertCell().textContent = result.name;
        var status = row.insertCell(); status.textContent = result.pass ? 'PASS' : 'FAIL'; status.className = result.pass ? 'pass' : 'fail';
        row.insertCell().textContent = result.details;
      });
      var passed = results.filter(function (result) { return result.pass; }).length;
      document.getElementById('summary').textContent = passed + '/' + results.length + ' passed';
    }

    function finish() {
      var passed = results.filter(function (result) { return result.pass; }).length;
      var report = { total: results.length, passed: passed, failed: results.length - passed, results: results };
      document.getElementById('qa-output').textContent = 'QA_JSON_START' + JSON.stringify(report) + 'QA_JSON_END';
      document.documentElement.dataset.qaComplete = 'true';
      document.title = passed === results.length ? 'DONE · Builder QA' : 'FAILED · Builder QA';
    }

    document.getElementById('builder').addEventListener('load', function () {
      frame = this.contentWindow;
      ns = frame.CRMDocumentBuilder;
      if (!ns || !ns.app) { document.getElementById('summary').textContent = 'Builder did not initialize.'; return; }
      var originalError = frame.console.error.bind(frame.console);
      frame.__qaConsoleErrors = [];
      frame.console.error = function () { frame.__qaConsoleErrors.push(Array.prototype.join.call(arguments, ' ')); originalError.apply(null, arguments); };
      ns.app.readyPromise.then(function () { app = ns.app; run(); }, function (error) { document.getElementById('summary').textContent = error.message; });
    });
  }());
  </script>
</body>
</html>
